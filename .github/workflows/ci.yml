name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number for a repair dispatch
        type: string
        default: ''
      expected-head-sha:
        description: Exact repaired PR commit
        type: string
        default: ''
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: cccp-ps/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
  website:
    needs: guard
    uses: cccp-ps/automation/.github/workflows/bun.yml@v1.0.0
    with:
      # renovate: datasource=npm depName=bun
      version: 1.4.2
      command: bun run ci
  required:
    name: ci / required
    if: always()
    needs: [guard, website]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: cccp-ps/automation/actions/dispatch-guard@v1.0.0
        with:
          token: ${{ github.token }}
          pr-number: ${{ inputs.pr-number }}
          expected-head-sha: ${{ inputs.expected-head-sha }}
      - uses: cccp-ps/automation/actions/gate@v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          required: guard website
